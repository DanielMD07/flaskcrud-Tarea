services:
  mysql:
    image: mysql:8.0
    container_name: flaskcrud-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Todo .sql en esta carpeta se ejecuta la primera vez que se crea el volumen
      - ./sql/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - flaskcrud-net

  web:
    build: .
    container_name: flaskcrud-web
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DB: ${MYSQL_DB:-flaskcrud}
      MYSQL_PORT: "3306"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - flaskcrud-net

volumes:
  mysql_data:

networks:
  flaskcrud-net:
